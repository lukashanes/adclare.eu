name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://adclare:adclare@localhost:5432/adclare?schema=public
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  TURNSTILE_REQUIRED: "0"
  SIGNUP_MODE: first-run
  ADMIN_ACCESS_PASSWORD: ci-admin-password
  ADMIN_SESSION_SECRET: ci-admin-session-secret-with-at-least-32-chars

jobs:
  app:
    name: App Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app checks
        run: npm run ci

  docker:
    name: Docker Build Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build migrator and web images
        run: npm run docker:check
